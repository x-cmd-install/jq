"},{"id":453012791,"node_id":"RA_kwDOAE3WVc4bAG03","name":"jq-windows-i386.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1082368,"digest":"sha256:a99cb668f95bdd788d9ee20529613b115e5d2a0d7f9127ee6976607e878558ba","download_count":2794,"created_at":"2026-06-20T14:10:29Z","updated_at":"2026-06-20T14:10:29Z"},{"id":453012792,"node_id":"RA_kwDOAE3WVc4bAG04","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":2302,"digest":"sha256:dc86824a41c165ece971ff691aff6e08bbfe6e1d1f531688b47ee78c283a85cd","download_count":176033,"created_at":"2026-06-20T14:10:29Z","updated_at":"2026-06-20T14:10:29Z"}],"body":"This is a patch release with security fixes and bug fixes since 1.8.1, along with new builds for Windows arm64 and Docker arm/v7.\r\nFull commit log can be found at <https://github.com/jqlang/jq/compare/jq-1.8.1...jq-1.8.2>.\r\n\r\n## Security fixes\r\n\r\n- CVE-2026-32316: Fix heap buffer overflow in `jvp_string_append` and `jvp_string_copy_replace_bad`. @itchyny e47e56d226519635768e6aab2f38f0ab037c09e5\r\n- CVE-2026-33947: Limit path depth to prevent stack overflow in `jv_setpath`, `jv_getpath`, `jv_delpaths`. @itchyny fb59f1491058d58bdc3e8dd28f1773d1ac690a1f\r\n- CVE-2026-33948: Fix NUL truncation in the JSON parser. @itchyny 6374ae0bcdfe33a18eb0ae6db28493b1f34a0a5b\r\n- CVE-2026-39956: Fix `_strindices` missing runtime type checks. @tlsbollei fdf8ef0f0810e3d365cdd5160de43db46f57ed03\r\n- CVE-2026-39979: Fix out-of-bounds read in `jv_parse_sized()`. @wader 2f09060afab23fe9390cce7cb860b10416e1bf5f\r\n- CVE-2026-40164: Randomize hash seed to mitigate hash collision DoS attacks. @AsafMeizner @itchyny 0c7d133c3c7e37c00b6d46b658a02244fdd3c784\r\n- CVE-2026-40612: Limit containment check depth to prevent stack overflow in `contains`. @itchyny d1a12569d91641135976a8536776a4a329c02cc2\r\n- CVE-2026-41256: Fix NUL truncation in program files loaded with `-f`. @itchyny 5a015deae35d19e3ebbc65db6c157a80e76df738\r\n- CVE-2026-41257: Fix signed-int overflow in `stack_reallocate`. @itchyny 01b3cded76daacbfddb7f8763700b0803bcb5c6f\r\n- CVE-2026-43894: Reject numeric literals longer than `DEC_MAX_DIGITS` (999999999). @itchyny 9761ceb7d6cc48c16b25f0ab1baaef0e701927e4\r\n- CVE-2026-43895: Reject embedded NUL bytes in module import paths. @itchyny 9d223f153c3632a207fa071caaa6292da33ae361\r\n- CVE-2026-43896: Limit recursive object merge depth to prevent stack overflow. @itchyny 532ccea6080ed6758f39fe9f6208a44b665023d2\r\n- CVE-2026-44777: Detect circular module imports to prevent stack overflow. @itchyny f58787c41835d9b17795730cb04925fdba25c71c\r\n- CVE-2026-47770: Guard deep structural equality and comparison recursion. @fuyu0425 7122866869960b55cea3646bc91334ef55787831\r\n- CVE-2026-49839: Fix heap-buffer-overflow in raw file loading. @itchyny e987df0d463d85fd70825e042a082427e8275b86\r\n- CVE-2026-54679: Tighten string length bounds and propagate invalid jv in implode. @itchyny 46d1da30944ce93dd671ac72b6513fc0eb747837\r\n- GHSA-gf4g-95wj-4q4r: Fix use-after-free in `args2obj()` array argument path. @sseal #3498\r\n- GHSA-hj52-j2c9-r8r4: Fix signed-int overflow in `tokenadd` to prevent buffer overflow. @itchyny 63751f8a9f94dc6d3370084ad0d60826c58b955d\r\n- Limit the number of function parameters and definitions to prevent SEGV. @OwenSanzas #3460\r\n- Pre-allocate `tokenbuf` for string parser to avoid undefined behavior. @fab1ano #3485\r\n- Avoid stack overflow when freeing deeply nested values. @itchyny 33d7bce3218ec718139342e5b48b475c4dea715f\r\n- Fix memory leaks and double frees. @itchyny #3487\r\n\r\n## Releasing\r\n\r\n- Add builds for Windows arm64. @dennisameling #3376\r\n- Support arm/v7 architecture in Docker images. @itchyny #3463\r\n- Update GPG signing key. @itchyny 0ff997f7c4c07660ffc6ad2506d5f56b8136208b\r\n- Add `artifact-metadata` permission for actions/attest. @itchyny #3530\r\n- Upload attestation bundle as a release artifact, allowing unauthenticated verification\r\n   via `gh attestation verify --bundle jq-attestation.json`. @itchyny #3563\r\n\r\n## CLI changes\r\n\r\n- Improve error message truncation with closing delimiters. @itchyny #3478\r\n- Remove extra space from `die` function output. @krtk6160 #3391\r\n- Fix raw input flag not to corrupt multi-byte characters. @itchyny #3421\r\n- Fix crash when importing a module with errors twice. @itchyny #3497\r\n- Increase the maximum printing depth from 256 to 10000. @ishnagy #3414\r\n\r\n## Changes to existing functions\r\n\r\n- Fix `rtrimstr(\"\")` always outputting `\"\"`. @A4-Tacks #3415\r\n- Fix infinite loop and undefined behavior in `del(.[nan])`. @itchyny #3490\r\n- Refactor `@uri` and `@urid` to fix multi-byte UTF-8 corruption. @itchyny #3495\r\n- Fix `tonumber` and `toboolean` to reject strings with embedded null bytes. @itchyny #3496\r\n- Fix undefined behavior in modulo operator. @fab1ano #3486\r\n- Fix reversed pointer subtraction in `f_env` bounds check. @itchyny #3465\r\n- Fix missing validity check in `f_strflocaltime` after `f_localtime`. @itchyny #3491\r\n- Fix year 2038 problem on 32-bit platforms. @itchyny #3407\r\n- Use `//` instead of `//=` in `from_entries` definition. @itchyny #3516\r\n\r\n## Build and test changes\r\n\r\n- Drop `strptime` test using non-portable `%F`. @alyssais #3365\r\n- Limit oniguruma depth to 1024 in `jq_fuzz_execute`. @sudhackar #3377\r\n- Fix localization test for time formatting functions. @itchyny #3409\r\n- Fix expected value assertion. @itchyny #3431 #3408\r\n- Fix typo in tests/jq.test. @bigmoonbit #3441\r\n- Refactor `tm2jv` to handle fractional seconds. @itchyny #3489\r\n- Fix `jq_fuzz_parse_stream`: use iterative parser API for streaming mode. @OwenSanzas #3499\r\n- Fix crashes and resource leaks in `jq_testsuite`. @itchyny #3509\r\n- Support building with `--disable-maintainer-mode` and source != build dir. @Saur2000 #3518\r\n- Add Solaris support. @vlmarek #3515\r\n- Respect `SOURCE_DATE_EPOCH` while generating man page. @McSinyx #3514\r\n- Fix undefined pointer arithmetic in UTF-8 helpers. @theyoucheng df924eae91af10cc236a907cdadd97813827aa1f\r\n- Fix one-byte over-read in `BASE64_DECODE_TABLE`. @itchyny #3547\r\n\r\n## Documentation changes\r\n\r\n- Add wiki link to navigation bar. @wader #3424\r\n- Add missing word in manual for rawfile. @jpmens #3434\r\n- Fix typo \"stder\" to \"stderr\". @jjatria #3446\r\n- Fix buttons in tutorial to toggle labels when clicked on. @itchyny #3493\r\n- Fix \"happened\" spelling in tutorial changelog entries. @Rohan5commit #3525\r\n","reactions":{"total_count":33,"+1":11,"-1":0,"laugh":0,"hooray":14,"confused":0,"heart":4,"rocket":0,"eyes":4},"mentions_count":22}
