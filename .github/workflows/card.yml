name: card

on:
  schedule:
    - cron: "27 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Single source of truth: x-cmd-install/x-cmd-install-action does
      # card → loc → scorecard in one shot. Pin to a tag for stability
      # or @main to ride the latest.
      - name: Collect card + loc + scorecard
        uses: x-cmd-install/x-cmd-install-action@main
        with:
          owner-repo: jqlang/jq
          # OpenSSF scorecard tracks the historical repo name even
          # after a rename. jq was moved from github.com/stedolan/jq
          # to github.com/jqlang/jq; the scorecard backend still
          # has the data under stedolan/jq.
          scorecard: stedolan/jq
          # Pin to stable stream while debugging x7 issues.
          stream: index.html
